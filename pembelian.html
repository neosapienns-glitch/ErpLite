  --purchase-text-strong: #e8eee9; --purchase-text-muted: #b4c0b8; --purchase-text-soft: #929f97;
  --purchase-panel: #202a25; --purchase-panel-head: #2c3831; --purchase-panel-card: #1f2923;
  --purchase-table-bg: #1f232c; --purchase-control-bg: #1f232c; --purchase-border: #3b4942;
  --purchase-control-border: #46534b; --purchase-row-alt: #242d27; --purchase-table-head: #26493a;

* { box-sizing: border-box; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --emboss-shadow: 0 5px 14px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.05), inset 0 -1px rgba(0,0,0,.2); --emboss-hover-shadow: 0 8px 18px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.06), inset 0 -1px rgba(0,0,0,.24); } }
:root[data-theme="dark"] { --emboss-shadow: 0 5px 14px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.05), inset 0 -1px rgba(0,0,0,.2); --emboss-hover-shadow: 0 8px 18px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.06), inset 0 -1px rgba(0,0,0,.24); }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }

.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 24px 16px 16px; background: linear-gradient(155deg, #214c40 0%, #183b34 52%, #122f2a 100%); color: #f3f7f4; }

.nav-item:hover, .nav-item.active { background: #2a564a; color: #fff; }
.nav-item.active { box-shadow: inset 3px 0 #9de2c7; }
.nav-icon { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid rgba(224,248,237,.24); border-radius: 8px; background: linear-gradient(145deg, rgba(238,255,246,.22), rgba(94,143,122,.1)); color: #e8fff4; text-align: center; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.48); box-shadow: 3px 4px 6px rgba(0,0,0,.22), inset 1px 1px rgba(255,255,255,.18), inset -2px -2px rgba(0,0,0,.12); transform: perspective(80px) rotateY(-7deg); transition: transform .18s ease, box-shadow .18s ease; }
.nav-item:hover .nav-icon, .nav-item.active .nav-icon { transform: perspective(80px) rotateY(-7deg) translateY(-1px); box-shadow: 3px 5px 8px rgba(0,0,0,.3), inset 1px 1px rgba(255,255,255,.26), inset -2px -2px rgba(0,0,0,.12); }

.sidebar-collapsed .nav-item.active { box-shadow: inset 0 0 0 1px #9de2c7; }
.workspace { min-width: 0; }
.page-topbar { position: sticky; top: 0; z-index: 10; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 28px; padding-top: calc(15px + env(safe-area-inset-top, 0px)); background: var(--card-bg); border-bottom: 1px solid var(--border); }

.sidebar-toggle-btn:hover { background: var(--bg); }
.page-content { max-width: 1440px; margin: 0 auto; padding: 28px; }
@media (max-width: 900px) { .app-shell { grid-template-columns: 206px minmax(0, 1fr); } .app-shell.sidebar-collapsed { grid-template-columns: 68px minmax(0, 1fr); } .page-topbar { padding-right: 22px; padding-left: 22px; } .page-content { padding: 22px; } }
@media (max-width: 640px) {
  .app-shell { display: flex; flex-direction: column; }

  .app-shell.sidebar-open .sidebar { display: flex; }
  .sidebar-brand { padding: 0 4px 12px; }
  .sidebar-label, .sidebar-footer { display: none; }

  .nav-item { min-height: 38px; padding: 8px 10px; }

}

.topbar {
  position: sticky; top: 0; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px));

}
.topbar-left { display: flex; flex-direction: column; min-width: 0; }

.back-link { font-size: 12px; color: var(--text-muted); text-decoration: none; }

.theme-toggle-btn, .logout-btn {

}

.subtabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 28px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
.subtab-btn {
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);

}

.container { max-width: 1440px; margin: 0 auto; padding: 0; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin: 4px 0 10px; letter-spacing: 0.04em; }

.field { margin-bottom: 14px; }

  font-size: 14px; background: var(--card-bg); color: var(--text);
}

.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

/* Dua kolom: Dokumen Pembelian (kiri) + Tambah Barang (kanan) biar hemat halaman */
.form-top-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
  align-items: start; margin-bottom: 4px;
}
.form-col { min-width: 0; }
@media (max-width: 1000px) { .form-top-grid { grid-template-columns: 1fr; gap: 4px; } }

.purchase-screen { color: var(--text); }
.purchase-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 0 18px; }
.purchase-page-head h1 { margin: 0; font-size: 21px; }
.purchase-page-head p { margin: 4px 0 0; color: var(--text-muted); font-size: 12px; }
.purchase-eyebrow { color: var(--primary); font-size: 10px; font-weight: 800; text-transform: uppercase; }
.purchase-reference { color: var(--text-muted); font-size: 11px; }
.purchase-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(340px, .9fr); gap: 16px; align-items: start; }
.purchase-catalog { min-width: 0; }
.catalog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.catalog-head h2, .purchase-cart-head h2 { margin: 0; font-size: 15px; }
.catalog-head p, .purchase-cart-head p { margin: 3px 0 0; color: var(--text-muted); font-size: 11px; }
.catalog-tools { display: flex; gap: 7px; min-width: min(320px, 55%); }

.catalog-tools .scan-btn { width: 40px; border-radius: 6px; }

.purchase-product:hover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 4%, var(--card-bg)); }
.purchase-product-code { color: var(--text-muted); font-size: 10px; }

.purchase-product-unit { color: var(--text-muted); font-size: 10px; }
.purchase-empty { grid-column: 1 / -1; padding: 28px 14px; border: 1px dashed var(--border); color: var(--text-muted); text-align: center; font-size: 12px; }
.purchase-cart { position: sticky; top: 162px; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 7px; background: var(--card-bg); box-shadow: var(--emboss-shadow); }
.purchase-cart-head { padding: 14px 15px; border-bottom: 1px solid var(--border); }

@media (max-width: 760px) {

.purchase-screen { width: 100%; height: 100%; min-height: 430px; display: grid; grid-template-columns: 66px minmax(0, 1fr); background: #edf3ef; color: #183b31; }

function addCatalogItem(itemId) {
  const item = itemsCache.find(candidate => candidate.id === itemId);
  if (!item || item.supplier_id !== selectedSupplierId) return;
  activePurchaseItemId = itemId;
  const existing = rows.find(r => r.item_id === itemId);
  if (existing) {
    existing.qty += 1;
  } else {
    rows.push({ item_id: item.id, qty: 1, price: Number(item.purchase_price) || 0 });

function updatePurchaseQty(index, value) {
  const row = rows[index];
  if (!row) return;
  const nextQty = Number(value);
  if (!Number.isFinite(nextQty) || nextQty <= 0) {
    renderInvoiceTable();
    return;
  }
  row.qty = nextQty;
  renderInvoiceTable();
}

function updatePurchaseDiscount(value) {
  const parsed = Number(value);
  purchaseDiscount = Number.isFinite(parsed) ? Math.min(100, Math.max(0, parsed)) : 0;
  const label = document.getElementById("purchaseDiscountLabel");
  if (label) label.textContent = purchaseDiscount > 0 ? `Diskon ${purchaseDiscount}% diterapkan` : "Belum ada diskon";
}

function applyPurchaseDiscount() {

          <td class="purchase-discount-cell">${purchaseDiscount}%<div>${rp(row.qty * row.price * purchaseDiscount / 100)}</div></td>

function updatePurchaseSummary() {
  const subtotal = rows.reduce((sum, row) => sum + (row.qty * row.price), 0);
  const discount = subtotal * purchaseDiscount / 100;
  const total = subtotal - discount;
  const subtotalElement = document.getElementById("subtotalValue");
  const discountElement = document.getElementById("discountValue");
  const grandTotal = document.getElementById("grandTotal");
  const cartCount = document.getElementById("purchaseCartCount");
  const totalDisplay = document.getElementById("purchaseTotalDisplay");
  const activeItem = itemsCache.find(item => item.id === activePurchaseItemId);
  const activeName = document.getElementById("purchaseActiveItemName");
  const activePrice = document.getElementById("purchaseActiveItemPrice");
  const submitButton = document.getElementById("submitBtn");
  if (subtotalElement) subtotalElement.textContent = rp(subtotal);
  if (discountElement) discountElement.textContent = `- ${rp(discount)}`;
  if (grandTotal) grandTotal.textContent = rp(total);
  if (cartCount) cartCount.textContent = `${rows.length} jenis barang`;
  if (totalDisplay) totalDisplay.textContent = rp(total);
  if (activeName) activeName.textContent = activeItem ? activeItem.name : "Cari barang atau scan barcode";
  if (activePrice) activePrice.textContent = activeItem ? `${rp(activeItem.purchase_price)} per ${activeItem.purchase_unit ? activeItem.purchase_unit.code : "unit"}` : "Harga beli tampil di sini";
  if (submitButton) submitButton.disabled = rows.length === 0;
}

// ---------- SCAN BARCODE ----------
let scannerStream = null;
let scannerLoopActive = false;

async function openScanner() {
  if (!("BarcodeDetector" in window)) {
    alert("Scan barcode gak didukung di browser ini. Pilih barang manual dari dropdown ya.");
    return;
  }

  const overlay = document.createElement("div");
  overlay.id = "scannerOverlay";
  overlay.className = "scanner-overlay";
  overlay.innerHTML = `
    <button class="scanner-close" onclick="closeScanner()">✕</button>
    <video id="scannerVideo" class="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-hint">Arahkan kamera ke barcode barang</div>
  `;
  document.body.appendChild(overlay);

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = document.getElementById("scannerVideo");
    video.srcObject = scannerStream;

    const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "qr_code"] });
    scannerLoopActive = true;
    scanLoop(video, detector);
  } catch (err) {
    alert("Gagal mengakses kamera: " + err.message);
    closeScanner();
  }
}

async function scanLoop(video, detector) {
  if (!scannerLoopActive) return;
  try {
    const codes = await detector.detect(video);
    if (codes.length > 0) {
      onBarcodeDetected(codes[0].rawValue);
      return;
    }
  } catch (e) { /* frame belum siap, lanjut coba lagi */ }
  requestAnimationFrame(() => scanLoop(video, detector));
}

function onBarcodeDetected(code) {
  closeScanner();
  const item = itemsCache.find(it => it.barcode && it.barcode === code);
  if (!item) {
    alert("Barcode " + code + " gak ketemu di data barang.");
    return;
  }
  if (item.supplier_id !== selectedSupplierId) {
    const owner = suppliersCache.find(s => s.id === item.supplier_id);
    alert(`Barang "${item.name}" terdaftar di supplier ${owner ? owner.name : "lain"}, bukan supplier yang lagi aktif.`);
    return;
  }
  addCatalogItem(item.id);
}

function closeScanner() {
  scannerLoopActive = false;
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  const overlay = document.getElementById("scannerOverlay");
  if (overlay) overlay.remove();
}

function onChangeSupplierForm(id) {
  if (id === selectedSupplierId) return;
  if (rows.length > 0 && !confirm("Mengganti pemasok akan mengosongkan faktur saat ini. Lanjutkan?")) {
    document.getElementById("f_supplier").value = selectedSupplierId;
    return;
  }
  selectedSupplierId = id;
  rows = [];
  purchaseDiscount = 0;
  catalogQuery = "";
  catalogFocused = false;
  const search = document.getElementById("purchaseSearchInput");
  if (search) search.value = "";
  renderProductCatalog();
  renderInvoiceTable();
  const supplier = suppliersCache.find(item => item.id === id);
  const footerSupplier = document.getElementById("purchaseFooterSupplier");
  const headerSupplier = document.getElementById("purchaseHeaderSupplier");
  if (footerSupplier) footerSupplier.textContent = supplier ? supplier.name : "Pilih pemasok";
  if (headerSupplier) headerSupplier.textContent = supplier ? supplier.name : "Pilih pemasok";
  const discountInput = document.getElementById("purchaseDiscountInput");
  if (discountInput) discountInput.value = "0";
  const discountLabel = document.getElementById("purchaseDiscountLabel");
  if (discountLabel) discountLabel.textContent = "Belum ada diskon";
}

async function onSubmitPurchase() {
  const btn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("alertBox");
  alertBox.className = "alert";

  if (rows.length === 0) {
    alertBox.textContent = "Tambah minimal 1 baris barang.";
    alertBox.className = "alert show alert-error";
    return;
  }
  for (const r of rows) {
    if (!r.qty || r.qty <= 0) {
      alertBox.textContent = "Qty semua baris harus lebih dari 0.";
      alertBox.className = "alert show alert-error";
      return;
    }
  }

  btn.disabled = true; btn.textContent = "Menyimpan...";

  const storeField = document.getElementById("f_store");
  const storeId = storeField ? storeField.value : activeStoreId;
  const notes = document.getElementById("f_notes").value.trim();
  const purchaseNotes = purchaseDiscount > 0
    ? [notes, `Diskon pembelian ${purchaseDiscount}%`].filter(Boolean).join(" | ")
    : notes;

  const payload = {
    p_store_id: storeId,
    p_supplier_id: document.getElementById("f_supplier").value,
    p_purchase_date: document.getElementById("f_date").value,
    p_invoice_number: document.getElementById("f_invoice").value.trim(),
    p_notes: purchaseNotes,
    p_items: rows.map(r => ({
      item_id: r.item_id,
      qty_purchase_unit: r.qty,
      unit_price: Number((r.price * (1 - purchaseDiscount / 100)).toFixed(2)),
    })),
  };

  const { error } = await supabaseClient.rpc("create_purchase", payload);
  if (error) {
    alertBox.textContent = error.message;
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = "Simpan Pembelian";
    return;
  }

  alertBox.textContent = "Pembelian berhasil disimpan, stok sudah bertambah.";
  alertBox.className = "alert show alert-success";
  btn.disabled = false; btn.textContent = "Simpan Pembelian";
  rows = [];
  purchaseDiscount = 0;
  activePurchaseItemId = null;
  document.getElementById("purchaseDiscountInput").value = "0";
  document.getElementById("purchaseDiscountLabel").textContent = "Belum ada diskon";
  renderInvoiceTable();
}

// ---------- HISTORI ----------
async function loadHistoryTab() {
  document.getElementById("mainContent").innerHTML = `<div class="loading">Memuat...</div>`;

  let query = supabaseClient
    .from("purchases")
    .select("id, purchase_date, invoice_number, total_amount, notes, suppliers(name), stores(name, store_code)")
    .order("created_at", { ascending: false })
    .limit(50);

  if (myRole === "admin_toko" || myRole === "staff_gudang") {
    query = query.eq("store_id", myStoreId);
  }

  const { data, error } = await query;
  if (error) { renderError("Gagal memuat histori: " + error.message); return; }

  const listHtml = (data || []).length === 0
    ? `<div class="empty-state">Belum ada transaksi pembelian.</div>`
    : data.map(p => `
        <div class="history-item">
          <div class="top-row">
            <span class="supplier-name">${p.suppliers ? escapeHtml(p.suppliers.name) : "-"}</span>
            <span class="amount">${rp(p.total_amount)}</span>
          </div>
          <div class="meta">${p.invoice_number ? escapeHtml(p.invoice_number) + " · " : ""}${p.purchase_date} · ${p.stores ? p.stores.store_code + " - " + escapeHtml(p.stores.name) : ""}</div>
          ${p.notes ? `<div class="meta">${escapeHtml(p.notes)}</div>` : ""}
        </div>
      `).join("");

  document.getElementById("mainContent").innerHTML = `
    <div class="section-title">Histori Pembelian</div>
    ${listHtml}
  `;
}

// ---------- INIT ----------
async function init() {
  const session = await requireLogin();
  if (!session) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles").select("role, organization_id, store_id")
    .eq("id", session.user.id).maybeSingle();
  if (error || !profile) { renderError("Gagal memuat profil."); return; }

  if (!["admin_organisasi", "admin_toko", "staff_gudang", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role)) {
    renderError("Kamu tidak punya akses ke halaman ini.");
    return;
  }

  myRole = profile.role;
  myOrgId = profile.organization_id;
  myStoreId = profile.store_id;
  activeStoreId = sessionStorage.getItem("smarterp_active_store_id") || myStoreId;

  const [sup, it, st] = await Promise.all([
    supabaseClient.from("suppliers").select("id, supplier_code, name").eq("organization_id", myOrgId).order("name"),
    supabaseClient.from("items").select("id, plu, barcode, name, supplier_id, purchase_price, purchase_unit:units!items_purchase_unit_id_fkey(code)").eq("organization_id", myOrgId).order("plu"),
    supabaseClient.from("stores").select("id, name, store_code").eq("organization_id", myOrgId).order("created_at"),
  ]);
  suppliersCache = sup.data || [];
  itemsCache = it.data || [];
  storesCache = st.data || [];

  renderFormTab();
}

init();
</script>
