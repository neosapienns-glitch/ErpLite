<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16856b" />
  <title>Offline - SmarterERP Lite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f2f5f2;
      color: #1f2937;
      font: 16px/1.6 "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    h1 { margin: 0 0 10px; color: #116b56; font-size: 24px; }
    p { margin: 0 0 22px; color: #56635d; }
    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: #16856b;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Kamu sedang offline</h1>
    <p>Halaman ini belum tersedia tanpa koneksi. Periksa jaringan lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
