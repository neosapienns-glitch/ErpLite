// ---------------------------------------------------------

const APP_VERSION = "2026-10-07-02";

const APP_MENUS = [

  { title: "Penjualan", icon: "💰", href: "penjualan.html", roles: ["admin_organisasi", "admin_toko"] },

function initAppShell() {
  const role = sessionStorage.getItem("smarterp_role");
  const currentPage = window.location.pathname.split("/").pop();
  const isShiftHolder = ["kepala_toko", "asisten_toko", "merchandiser"].includes(role);
  const links = [{ title: "Dashboard", icon: "⌂", href: "dashboard.html" }, ...APP_MENUS.filter(menu => !role || menu.roles.includes(role) || (isShiftHolder && menu.href !== "daftar-toko.html"))];
  document.getElementById("sidebarNav").innerHTML = links.map(menu => `
    <a class="nav-item ${menu.href === currentPage ? "active" : ""}" href="${menu.href}" ${menu.href === currentPage ? 'aria-current="page"' : ""}>
      <span class="nav-icon">${menu.icon}</span><span class="nav-text">${menu.title}</span>
    </a>
  `).join("");
}

function toggleSidebar() {
  const shell = document.querySelector(".app-shell");
  const button = document.getElementById("sidebarToggleBtn");
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  const isOpen = isMobile
    ? shell.classList.toggle("sidebar-open")
    : (shell.classList.toggle("sidebar-collapsed"), !shell.classList.contains("sidebar-collapsed"));
  button.setAttribute("aria-expanded", String(isOpen));
  button.setAttribute("aria-label", isOpen ? "Tutup sidebar" : "Buka sidebar");
  button.title = isOpen ? "Tutup sidebar" : "Buka sidebar";
}
initAppShell();

function applyThemeIcon() {
  const current = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  btn.textContent = current === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  let next;
  if (!current) next = 'light';
  else if (current === 'light') next = 'dark';
  else next = null;
  if (next) { html.setAttribute('data-theme', next); localStorage.setItem('smarterp_theme', next); }
  else { html.removeAttribute('data-theme'); localStorage.removeItem('smarterp_theme'); }
  applyThemeIcon();
}
function updateOnlineStatus() {
  const dot = document.getElementById('onlineDot');
  const text = document.getElementById('onlineText');
  if (!dot || !text) return;
  const online = navigator.onLine;
  dot.style.background = online ? 'var(--success)' : 'var(--danger)';
  text.textContent = online ? 'Online' : 'Offline';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/app-version"\s+content="([^"]+)"/);
    if (match && match[1] !== APP_VERSION) showUpdateBanner();
  } catch (e) {}
}
function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  const b = document.createElement('div');
  b.id = 'updateBanner'; b.className = 'update-banner';
  b.innerHTML = 'Ada pembaruan halaman ini. <button onclick="location.reload()">Muat ulang</button>';
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);
setInterval(checkForUpdate, 60000);
document.addEventListener('DOMContentLoaded', () => { applyThemeIcon(); updateOnlineStatus(); });

async function requireLogin() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) { window.location.href = "index.html"; return null; }
  return data.session;
}
async function logoutUser() {
  await supabaseClient.auth.signOut();
  sessionStorage.clear();
  window.location.href = "index.html";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function openFormModal(title, bodyHtml) {
  closeFormModal();
  const overlay = document.createElement("div");
  overlay.id = "formModalOverlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header"><h3>${title}</h3><button class="modal-close-btn" onclick="closeFormModal()">✕</button></div>
      ${bodyHtml}
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeFormModal() {
  const el = document.getElementById("formModalOverlay");
  if (el) el.remove();
}

let myRole = null;
let myOrgId = null;
let myStoreId = null;
let activeStoreId = null;
let itemsCache = [];
let canAdjust = false;

function renderError(message) {
  document.getElementById("mainContent").innerHTML = `<div class="error-box">${message}</div>`;
}

async function renderStoreSelector() {
  const { data: stores } = await supabaseClient
    .from("stores").select("id, name, store_code").eq("organization_id", myOrgId).order("created_at");
  if (!stores || stores.length === 0) return "";
  if (!activeStoreId) activeStoreId = stores[0].id;
  return `
    <div class="field">
      <label>Toko</label>
      <select id="storeSelector" onchange="onChangeStoreSelector(this.value)">
        ${stores.map(s => `<option value="${s.id}" ${s.id === activeStoreId ? "selected" : ""}>${s.store_code} - ${s.name}</option>`).join("")}
      </select>
    </div>
  `;
}

function onChangeStoreSelector(id) {
  activeStoreId = id;
  loadStok();
}

async function loadItemsCache() {
  const { data } = await supabaseClient
    .from("items").select("id, plu, name, base_unit_id, units!items_base_unit_id_fkey(code)")
    .eq("organization_id", myOrgId).order("plu");
  itemsCache = data || [];
}

function qtyClass(qty) {
  if (qty <= 0) return "zero";
  if (qty < 10) return "low";

}

async function loadStok() {
  if (itemsCache.length === 0) await loadItemsCache();

  if (itemsCache.length === 0) {
    document.getElementById("mainContent").innerHTML = `<div class="empty-state">Belum ada data Barang. Isi dulu di Master Barang.</div>`;
    return;
  }

  const storeSelectorHtml = (myRole === "admin_organisasi" || myRole === "super_admin")
    ? await renderStoreSelector()
    : "";

  if (!activeStoreId) activeStoreId = myStoreId;
  if (!activeStoreId) {
    document.getElementById("mainContent").innerHTML = `<div class="empty-state">Toko belum ditentukan.</div>`;
    return;
  }

  const { data: balances, error } = await supabaseClient
    .from("stock_balances").select("item_id, qty").eq("store_id", activeStoreId);
  if (error) { renderError("Gagal memuat stok: " + error.message); return; }

  const balanceMap = {};
  (balances || []).forEach(b => { balanceMap[b.item_id] = b.qty; });

  const listHtml = itemsCache.map(it => {
    const qty = balanceMap[it.id] || 0;
    return `
      <div class="list-item">
        <div>
          <span class="code">${it.plu}</span>
          <div class="name">${escapeHtml(it.name)}</div>
        </div>
        <div class="qty-badge ${qtyClass(qty)}">
          ${Number(qty).toLocaleString("id-ID")}
          <span class="unit">${it.units ? it.units.code : ""}</span>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("mainContent").innerHTML = `
    <div class="section-title">Stok</div>
    ${storeSelectorHtml}
    ${canAdjust ? `<div class="add-btn-row"><button class="btn-add" onclick="openAdjustModal()">+ Penyesuaian Stok</button></div>` : ""}
    ${listHtml}
  `;
}

function openAdjustModal() {
  openFormModal("Penyesuaian Stok", `
    <div id="alertBox" class="alert"></div>
    <form id="adjustForm">
      <div class="field">
        <label>Barang</label>
        <select id="f_item">
          ${itemsCache.map(it => `<option value="${it.id}">${it.plu} - ${escapeHtml(it.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Perubahan Qty</label>
        <input type="number" id="f_qty" required step="any" placeholder="Contoh: 50 (nambah) atau -5 (ngurangin)" />
        <div class="field-hint">Isi stok awal: masukin angka positif. Koreksi barang hilang/rusak: masukin angka negatif.</div>
      </div>
      <div class="field"><label>Catatan</label><input type="text" id="f_note" placeholder="Contoh: Stok awal toko" /></div>
      <button type="submit" class="btn-primary" id="submitBtn">Simpan</button>
    </form>
  `);
  document.getElementById("adjustForm").addEventListener("submit", onSubmitAdjust);
}

async function onSubmitAdjust(e) {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("alertBox");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  alertBox.className = "alert";

  const qty = parseFloat(document.getElementById("f_qty").value);
  if (isNaN(qty) || qty === 0) {
    alertBox.textContent = "Masukkan angka yang valid (gak boleh 0).";
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = "Simpan";
    return;
  }

  const { error } = await supabaseClient.rpc("adjust_stock", {
    p_store_id: activeStoreId,
    p_item_id: document.getElementById("f_item").value,
    p_qty_change: qty,
    p_movement_type: "penyesuaian",
    p_note: document.getElementById("f_note").value.trim(),
  });

  if (error) {
    alertBox.textContent = error.message;
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = "Simpan";
    return;
  }

  closeFormModal();
  await loadStok();
}

async function init() {
  const session = await requireLogin();
  if (!session) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles").select("role, organization_id, store_id")
    .eq("id", session.user.id).maybeSingle();
  if (error || !profile) { renderError("Gagal memuat profil."); return; }

  if (!["admin_organisasi", "admin_toko", "staff_gudang", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role)) {
    renderError("Kamu tidak punya akses ke halaman ini.");
    return;
  }

  myRole = profile.role;
  myOrgId = profile.organization_id;
  myStoreId = profile.store_id;
  canAdjust = ["admin_organisasi", "admin_toko", "staff_gudang", "super_admin"].includes(profile.role);
    canAdjust = ["admin_organisasi", "admin_toko", "staff_gudang", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role);
  activeStoreId = sessionStorage.getItem("smarterp_active_store_id") || myStoreId;

  await loadStok();
}

init();
</script>
