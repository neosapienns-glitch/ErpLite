.update-banner {

<script>

// Client terpisah, TANPA simpan sesi - dipakai khusus buat bikin akun staff

// ---------------------------------------------------------
// SHARED HELPERS
// ---------------------------------------------------------
const APP_VERSION = "2026-10-07-02";

const APP_MENUS = [
  { title: "POS Penjualan", icon: "🧾", href: "pos-penjualan.html", roles: ["admin_organisasi", "admin_toko", "kasir"] },
  { title: "Penjualan", icon: "💰", href: "penjualan.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Stok", icon: "📦", href: "stok.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Pembelian", icon: "🛒", href: "pembelian.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Transfer Stok", icon: "🔄", href: "transfer-stok.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Stok Opname", icon: "📋", href: "stok-opname.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Laporan", icon: "📊", href: "laporan.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Master Barang", icon: "🏷️", href: "menu.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Daftar Toko", icon: "🏬", href: "daftar-toko.html", roles: ["super_admin", "admin_organisasi"] },
  { title: "Pengguna", icon: "👥", href: "pengguna.html", roles: ["super_admin", "admin_organisasi", "admin_toko"] },
];

function initAppShell() {
  const role = sessionStorage.getItem("smarterp_role");
  const currentPage = window.location.pathname.split("/").pop();
  const isShiftHolder = ["kepala_toko", "asisten_toko", "merchandiser"].includes(role);
  const links = [{ title: "Dashboard", icon: "⌂", href: "dashboard.html" }, ...APP_MENUS.filter(menu => !role || menu.roles.includes(role) || (isShiftHolder && menu.href !== "daftar-toko.html"))];
  document.getElementById("sidebarNav").innerHTML = links.map(menu => `
    <a class="nav-item ${menu.href === currentPage ? "active" : ""}" href="${menu.href}" ${menu.href === currentPage ? 'aria-current="page"' : ""}>
      <span class="nav-icon">${menu.icon}</span><span class="nav-text">${menu.title}</span>
    </a>
  `).join("");
}

function toggleSidebar() {
  const shell = document.querySelector(".app-shell");
  const button = document.getElementById("sidebarToggleBtn");
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  const isOpen = isMobile
    ? shell.classList.toggle("sidebar-open")
    : (shell.classList.toggle("sidebar-collapsed"), !shell.classList.contains("sidebar-collapsed"));
  button.setAttribute("aria-expanded", String(isOpen));
  button.setAttribute("aria-label", isOpen ? "Tutup sidebar" : "Buka sidebar");
  button.title = isOpen ? "Tutup sidebar" : "Buka sidebar";
}
initAppShell();

function applyThemeIcon() {
  const current = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  btn.textContent = current === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  let next;
  if (!current) next = 'light';
  else if (current === 'light') next = 'dark';
  else next = null;
  if (next) { html.setAttribute('data-theme', next); localStorage.setItem('smarterp_theme', next); }
  else { html.removeAttribute('data-theme'); localStorage.removeItem('smarterp_theme'); }
  applyThemeIcon();
}
function updateOnlineStatus() {
  const dot = document.getElementById('onlineDot');
  const text = document.getElementById('onlineText');
  if (!dot || !text) return;
  const online = navigator.onLine;
  dot.style.background = online ? 'var(--success)' : 'var(--danger)';
  text.textContent = online ? 'Online' : 'Offline';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/app-version"\s+content="([^"]+)"/);
    if (match && match[1] !== APP_VERSION) showUpdateBanner();
  } catch (e) {}
}
function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  const b = document.createElement('div');
  b.id = 'updateBanner'; b.className = 'update-banner';
  b.innerHTML = 'Ada pembaruan halaman ini. <button onclick="location.reload()">Muat ulang</button>';
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);
setInterval(checkForUpdate, 60000);
document.addEventListener('DOMContentLoaded', () => { applyThemeIcon(); updateOnlineStatus(); });

async function requireLogin() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) { window.location.href = "index.html"; return null; }
  return data.session;
}
async function logoutUser() {
  await supabaseClient.auth.signOut();
  sessionStorage.clear();
  window.location.href = "index.html";
}

const ROLE_LABEL = {
  super_admin: "Super Admin",
  admin_organisasi: "Admin Organisasi",
  admin_toko: "Admin Toko",
  kepala_toko: "Kepala Toko",
  asisten_toko: "Asisten Toko",
  merchandiser: "Merchandiser",
  kasir: "Kasir",
  staff_gudang: "Staff Gudang",
};

let myRole = null;
let myOrgId = null;
let myStoreId = null;
let orgStores = [];

function renderError(message) {
  document.getElementById("mainContent").innerHTML = `<div class="error-box">${message}</div>`;
}

function roleOptionsFor(role) {
  if (["admin_organisasi", "super_admin"].includes(role)) {
    return [
      { value: "admin_toko", label: "Admin Toko (penanggung jawab 1 toko)" },
      { value: "kepala_toko", label: "Kepala Toko (PIC shift & back office)" },
      { value: "asisten_toko", label: "Asisten Toko (PIC shift & back office)" },
      { value: "merchandiser", label: "Merchandiser (PIC shift & back office)" },
      { value: "kasir", label: "Kasir / Pramuniaga (hanya POS Penjualan)" },
      { value: "staff_gudang", label: "Staff Gudang (stok, pembelian, transfer)" },
    ];
  }
  // admin_toko cuma boleh bikin staff di tokonya sendiri
  return [
    { value: "kasir", label: "Kasir / Pramuniaga (hanya POS Penjualan)" },
    { value: "staff_gudang", label: "Staff Gudang (stok, pembelian, transfer)" },
  ];
}

function renderUserList(users) {
  if (users.length === 0) return `<div class="empty-state">Belum ada pengguna lain.</div>`;
  return users.map(u => `
    <div class="user-card">
      <div>
        <div class="name">${u.full_name || "(tanpa nama)"}</div>
        <div class="email">${u.email || "-"}</div>
        <div class="meta">${u.store_code ? u.store_code + " - " + u.store_name : "Semua toko"}</div>
      </div>
      <span class="role-chip">${ROLE_LABEL[u.role] || u.role}</span>
    </div>
  `).join("");
}

  if (["admin_toko", "kepala_toko", "asisten_toko", "merchandiser"].includes(myRole) && !myStoreId) {

  const roles = roleOptionsFor(myRole);

  return `

      <div id="alertBox" class="alert"></div>
      <form id="formUser">
        <div class="field">
          <label>Nama Lengkap</label>
          <input type="text" id="newUserName" required placeholder="Nama staff" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="newUserEmail" required placeholder="staff@email.com" />
        </div>
        <div class="field">
          <label>Password Awal</label>
          <input type="text" id="newUserPassword" required minlength="6" placeholder="Minimal 6 karakter" />
          <div class="field-hint">Kasih tau password ini ke staff-nya langsung. Dia bisa ganti nanti.</div>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="newUserRole">${roleOptionsHtml}</select>
        </div>
        ${storeFieldHtml}
        <button type="submit" class="btn-primary" id="submitUserBtn">Tambah Pengguna</button>
      </form>
    </div>
  `;
}

async function onSubmitUser(e) {
  e.preventDefault();
  const btn = document.getElementById("submitUserBtn");
  const alertBox = document.getElementById("alertBox");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  alertBox.className = "alert";

  const fullName = document.getElementById("newUserName").value.trim();
  const email = document.getElementById("newUserEmail").value.trim();
  const password = document.getElementById("newUserPassword").value;
  const role = document.getElementById("newUserRole").value;
  const storeId = document.getElementById("newUserStore").value;

  try {
    const { data: signUpData, error: signUpError } = await inviteClient.auth.signUp({ email, password });
    if (signUpError) throw signUpError;
    if (!signUpData.user) throw new Error("Gagal membuat akun staff.");

    const { error: rpcError } = await supabaseClient.rpc("invite_user", {
      target_user_id: signUpData.user.id,
      full_name: fullName,
      email: email,
      new_role: role,
      target_store_id: storeId,
    });
    if (rpcError) throw rpcError;

    alertBox.innerHTML = `
      <div class="credential-box">
        Pengguna berhasil dibuat. Info login untuk staff:<br />
        Email: <code>${email}</code><br />
        Password: <code>${password}</code>
      </div>
    `;
    alertBox.className = "alert show alert-success";

    await loadUsers();
  } catch (err) {
    alertBox.textContent = err.message || "Gagal menambah pengguna.";
    alertBox.className = "alert show alert-error";
  } finally {
    btn.disabled = false; btn.textContent = "Tambah Pengguna";
  }
}

async function loadUsers() {
  let query = supabaseClient
    .from("profiles")
    .select("id, full_name, email, role, store_id, stores(name, store_code)")
    .eq("organization_id", myOrgId);

  if (["admin_toko", "kepala_toko", "asisten_toko", "merchandiser"].includes(myRole)) {
    query = query.eq("store_id", myStoreId);
  }

  const { data: users, error } = await query.order("created_at", { ascending: true });
  if (error) { renderError("Gagal memuat daftar pengguna: " + error.message); return; }

  const mapped = (users || []).map(u => ({
    full_name: u.full_name,
    email: u.email,
    role: u.role,
    store_name: u.stores ? u.stores.name : null,
    store_code: u.stores ? u.stores.store_code : null,
  }));

  document.getElementById("mainContent").innerHTML = `
    <div class="section-title">Pengguna (${mapped.length})</div>
    ${renderUserList(mapped)}
    ${renderForm()}
  `;

  const form = document.getElementById("formUser");
  if (form) form.addEventListener("submit", onSubmitUser);
}

async function init() {
  const session = await requireLogin();
  if (!session) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("role, organization_id, store_id")
    .eq("id", session.user.id)
    .maybeSingle();

  if (error || !profile) { renderError("Gagal memuat profil."); return; }

  if (!["admin_organisasi", "admin_toko", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role)) {
    renderError("Halaman ini khusus untuk Admin Organisasi / Admin Toko.");
    return;
  }

  myRole = profile.role;
  myOrgId = profile.organization_id;
  myStoreId = profile.store_id;

  if (myRole === "admin_organisasi" || myRole === "super_admin") {
    const { data: stores } = await supabaseClient
      .from("stores").select("id, name, store_code").eq("organization_id", myOrgId);
    orgStores = stores || [];
  }

  await loadUsers();
}

init();
</script>
