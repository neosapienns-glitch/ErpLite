const APP_VERSION = "2026-10-12-02"; // naikkan manual tiap kali file ini di-update & di-deploy ulang

function applyThemeIcon() {
  const current = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  btn.textContent = current === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  let next;
  if (!current) next = 'light';
  else if (current === 'light') next = 'dark';
  else next = null;

  if (next) {
    html.setAttribute('data-theme', next);
    localStorage.setItem('smarterp_theme', next);
  } else {
    html.removeAttribute('data-theme');
    localStorage.removeItem('smarterp_theme');
  }
  applyThemeIcon();
}

function updateOnlineStatus() {
  const dot = document.getElementById('onlineDot');
  const text = document.getElementById('onlineText');
  if (!dot || !text) return;
  const online = navigator.onLine;
  dot.style.background = online ? 'var(--success)' : 'var(--danger)';
  text.textContent = online ? 'Online' : 'Offline';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/app-version"\s+content="([^"]+)"/);
    if (match && match[1] !== APP_VERSION) showUpdateBanner();
  } catch (e) { /* offline atau gagal fetch, abaikan */ }
}

function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  const b = document.createElement('div');
  b.id = 'updateBanner';
  b.className = 'update-banner';
  b.innerHTML = 'Ada pembaruan halaman ini. <button onclick="location.reload()">Muat ulang</button>';
  document.body.appendChild(b);
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);
setInterval(checkForUpdate, 60000);

document.addEventListener('DOMContentLoaded', () => {
  applyThemeIcon();
  updateOnlineStatus();
});

async function requireLogin() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) {
    window.location.href = "index.html";
    return null;
  }
  return data.session;
}

async function logoutUser() {
  await supabaseClient.auth.signOut();
  sessionStorage.clear();
  window.location.href = "index.html";
}

function renderError(message) {
  document.getElementById("mainContent").innerHTML = `<div class="error-box">${message}</div>`;
}

let activeBackofficeCategory = "inventory";
let currentDashboardRole = null;

function renderBackofficeTabs() {
  document.getElementById("categoryNav").innerHTML = BACKOFFICE_CATEGORIES.map(category => `
    <button class="category-tab ${category.key === activeBackofficeCategory ? "active" : ""}" type="button"
      aria-current="${category.key === activeBackofficeCategory ? "page" : "false"}"
      onclick="switchBackofficeCategory('${category.key}')">${category.label}</button>
  `).join("");
  const category = BACKOFFICE_CATEGORIES.find(item => item.key === activeBackofficeCategory) || BACKOFFICE_CATEGORIES[0];
  const modules = category.modules.filter(module => module.roles.includes(currentDashboardRole));
  document.getElementById("moduleToolbar").innerHTML = modules.length
    ? modules.map(module => `<a class="module-shortcut" href="${module.href}" title="${module.description}"><span class="icon" aria-hidden="true">${module.icon}</span><span>${module.title}</span></a>`).join("")
    : `<span class="module-empty">Tidak ada modul untuk role akun ini.</span>`;
}

function renderBackofficePanel() {
  const category = BACKOFFICE_CATEGORIES.find(item => item.key === activeBackofficeCategory) || BACKOFFICE_CATEGORIES[0];
  const modules = category.modules.filter(module => module.roles.includes(currentDashboardRole));
  document.getElementById("backofficePanel").innerHTML = `
    <div><h2>${category.label}</h2><p>${category.description}</p></div>
    <span class="backoffice-status">${modules.length} modul tersedia</span>
    ${category.note ? `<div class="module-note">${category.note}</div>` : ""}
  `;
}

function switchBackofficeCategory(key) {
  if (!BACKOFFICE_CATEGORIES.some(category => category.key === key)) return;
  activeBackofficeCategory = key;
  renderBackofficeTabs();
  renderBackofficePanel();
}

function renderBackoffice(role) {
  currentDashboardRole = role;
  return `<section class="backoffice" aria-label="Kategori backoffice aktif">
    <div class="backoffice-content" id="backofficePanel" aria-live="polite"></div>
  </section>`;
}

async function renderSummary(orgId, storeId) {
  const [itemsResult, stockResult, shiftsResult] = await Promise.all([
    supabaseClient.from("items").select("id").eq("organization_id", orgId),
    storeId
      ? supabaseClient.from("stock_balances").select("item_id, qty").eq("store_id", storeId)
      : Promise.resolve({ data: null, error: null }),
    supabaseClient.from("cashier_shifts").select("id", { count: "exact", head: true }).eq("status", "open"),
  ]);
  const stockMap = new Map((stockResult.data || []).map(row => [row.item_id, Number(row.qty || 0)]));
  const itemRows = itemsResult.data || [];
  const availableItems = itemRows.filter(item => (stockMap.get(item.id) || 0) > 0).length;
  const lowStock = itemRows.filter(item => (stockMap.get(item.id) || 0) <= 10).length;
  const itemCount = itemsResult.error ? "-" : (itemsResult.data || []).length.toLocaleString("id-ID");
  const stockCount = itemsResult.error || stockResult.error || !storeId ? "-" : availableItems.toLocaleString("id-ID");
  const lowStockCount = itemsResult.error || stockResult.error || !storeId ? "-" : lowStock.toLocaleString("id-ID");
  const openShiftCount = shiftsResult.error ? "-" : Number(shiftsResult.count || 0).toLocaleString("id-ID");
  return `
    <div class="section-title">Posisi Operasional</div>
    <div class="summary-grid">
      <div class="summary-card" id="operational-summary">
        <div class="label">Barang Terdaftar</div>
        <div class="value">${itemCount}</div>
        <div class="hint">Master barang organisasi</div>
      </div>
      <div class="summary-card">
        <div class="label">Barang Tersedia</div>
        <div class="value">${stockCount}</div>
        <div class="hint">${storeId ? "SKU dengan stok lebih dari 0" : "Pilih toko untuk melihat stok"}</div>
      </div>
      <div class="summary-card">
        <div class="label">Stok Menipis</div>
        <div class="value">${lowStockCount}</div>
        <div class="hint">Barang dengan stok 10 atau kurang</div>
      </div>
      <div class="summary-card">
        <div class="label">Shift Kasir Aktif</div>
        <div class="value">${openShiftCount}</div>
        <div class="hint">Shift yang sedang terbuka</div>
      </div>
    </div>
  `;
}

async function getOrgStores(orgId) {
  const { data: stores } = await supabaseClient
    .from("stores")
    .select("id, name, store_code")
    .eq("organization_id", orgId)
    .order("created_at", { ascending: true });
  return stores || [];
}

function renderStoreSwitcherHtml(stores, currentStoreId) {
  if (stores.length === 0) return "";
  const options = stores.map(s =>
    `<option value="${s.id}" ${s.id === currentStoreId ? "selected" : ""}>${s.store_code} - ${s.name}</option>`
  ).join("");
  return `
    <div class="store-switcher">
      <label for="storeSwitcherSelect">Pilih toko</label>
      <select id="storeSwitcherSelect" onchange="onSwitchStore(this.value)">
        ${options}
      </select>
    </div>
  `;
}

function onSwitchStore(storeId) {
  sessionStorage.setItem("smarterp_active_store_id", storeId);
  loadDashboard();
}

// ---------------------------------------------------------
// SHIFT KASIR
// ---------------------------------------------------------
let activeShift = null;

async function getMyOpenShift(userId, storeId) {
  const { data } = await supabaseClient
    .from("cashier_shifts")
    .select("id, opened_at, opening_cash")
    .eq("status", "open")
    .eq("user_id", userId)
    .eq("store_id", storeId)
    .order("opened_at", { ascending: false })
    .limit(1)
    .maybeSingle();
  return data;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("id-ID", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" });
}

function renderShiftWidget() {
  if (!activeShift) {
    return `
      <div class="shift-card">
        <div class="shift-status"><span class="dot closed"></span><span class="label">Kasir Belum Dibuka</span></div>
        <div class="shift-meta">Buka kasir dulu sebelum mulai transaksi di POS.</div>
        <div class="shift-actions"><a class="btn-open" href="pos-penjualan.html">Masuk POS &amp; Buka Shift</a></div>
      </div>
    `;
  }
  return `
    <div class="shift-card">
      <div class="shift-status"><span class="dot open"></span><span class="label">Kasir Aktif</span></div>
      <div class="shift-meta">Dibuka ${formatTime(activeShift.opened_at)} · Modal awal Rp ${Number(activeShift.opening_cash).toLocaleString("id-ID")}</div>
      <div class="shift-actions"><a class="btn-open" href="pos-penjualan.html">Kelola shift &amp; cetak struk di POS</a></div>
    </div>
  `;
}

function showModal(title, onConfirm, showReceiptSettings = false) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  const receiptWidth = localStorage.getItem("smarterp_receipt_width") === "80" ? "80" : "58";
  setDashboardReceiptWidth(receiptWidth);
  const receiptSettings = showReceiptSettings
    ? `<label for="receiptWidthSelect">Lebar kertas struk<select id="receiptWidthSelect" onchange="setDashboardReceiptWidth(this.value)"><option value="58" ${receiptWidth === "58" ? "selected" : ""}>Thermal 58 mm</option><option value="80" ${receiptWidth === "80" ? "selected" : ""}>Thermal 80 mm</option></select></label>`
    : "";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${title}</h3>
      <input type="text" id="modalCashInput" inputmode="numeric" placeholder="Jumlah uang (Rp)" oninput="formatDashboardMoney(this)" />
      ${receiptSettings}
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeModal()">Batal</button>
        <button class="modal-confirm" id="modalConfirmBtn">Konfirmasi</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("modalConfirmBtn").addEventListener("click", async () => {
    const val = parseDashboardMoney(document.getElementById("modalCashInput").value);
    if (isNaN(val) || val < 0) { alert("Masukkan jumlah yang valid"); return; }
    await onConfirm(val);
    closeModal();
  });
}

function parseDashboardMoney(value) {
  const digits = String(value ?? "").replace(/\D/g, "");
  return digits ? Number(digits) : 0;
}

function formatDashboardMoney(input) {
  const digits = input.value.replace(/\D/g, "");
  input.value = digits ? Number(digits).toLocaleString("id-ID") : "";
}

function setDashboardReceiptWidth(value) {
  const width = value === "80" ? "80" : "58";
  localStorage.setItem("smarterp_receipt_width", width);
  document.documentElement.style.setProperty("--receipt-width", `${width}mm`);
}

function closeModal() {
  const overlay = document.getElementById("modalOverlay");
  if (overlay) overlay.remove();
}

function escapeReceiptText(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[character]);
}

function getShiftDemoSales(shiftId) {
  try {
    const sales = JSON.parse(localStorage.getItem("smarterp_demo_sales") || "[]");
    return sales.filter(sale => sale.shiftId === shiftId);
  } catch {
    return [];
  }
}

async function renderDashboardClosingReceipt(closeType, closingCash) {
  const shift = activeShift;
  const demoSales = getShiftDemoSales(shift.id);
  const demoSummary = demoSales.reduce((summary, sale) => ({
    count: summary.count + 1,
    total: summary.total + Number(sale.total || 0),
    cashNet: summary.cashNet + Number(sale.cash || 0) - Number(sale.change || 0),
    items: summary.items + (sale.items || []).reduce((count, item) => count + Number(item.qty || 0), 0),
  }), {count:0,total:0,cashNet:0,items:0});
  const {data:sales,error:salesError} = await supabaseClient.from("sales").select("id,total_amount").eq("shift_id",shift.id);
  const serverSales = sales || [];
  const serverTotal = serverSales.reduce((total, sale) => total + Number(sale.total_amount || 0), 0);
  const expectedCash = Number(shift.opening_cash || 0) + demoSummary.cashNet;
  const variance = Number(closingCash) - expectedCash;
  const money = value => `Rp ${Number(value || 0).toLocaleString("id-ID")}`;
  const row = (label, value) => `<div class="closing-receipt-row"><span>${label}</span><span>${value}</span></div>`;
  const separator = `<div class="closing-receipt-separator"></div>`;
  const title = closeType === "harian" ? "STRUK TUTUP HARIAN" : "STRUK TUTUP SHIFT";
  const varianceNote = serverSales.length
    ? "Variance hanya mencakup transaksi demo; rincian tender transaksi server tidak tersedia."
    : "Variance dihitung dari modal awal dan transaksi demo POS yang tertaut ke shift ini.";
  const receipt = document.getElementById("closeShiftReceipt");
  receipt.hidden = false;
  receipt.innerHTML = `<h2>${title}</h2><div style="text-align:center">SMARTERERP LITE · ${escapeReceiptText(document.getElementById("activeStoreLabel")?.textContent || "")}</div>${separator}${row("Waktu tutup", new Date().toLocaleString("id-ID"))}${row("Kasir / PIC", escapeReceiptText(sessionStorage.getItem("smarterp_full_name") || "-"))}${separator}${row("Modal awal", money(shift.opening_cash))}${row("Transaksi server", salesError ? "Tidak tersedia" : serverSales.length)}${row("Penjualan server", salesError ? "Tidak tersedia" : money(serverTotal))}${row("Transaksi POS demo", demoSummary.count)}${row("Penjualan POS demo", money(demoSummary.total))}${row("Item POS demo", demoSummary.items)}${row("Kas bersih POS demo", money(demoSummary.cashNet))}${separator}${row("Uang fisik saat tutup", money(closingCash))}${row("Kas seharusnya", money(expectedCash))}<div class="closing-receipt-row"><strong>VARIANCE KAS</strong><strong>${variance < 0 ? "-" : "+"}${money(Math.abs(variance))}</strong></div>${separator}<div>${escapeReceiptText(varianceNote)}</div>${salesError ? `<div>Data server tidak tersedia: ${escapeReceiptText(salesError.message)}</div>` : ""}<div class="closing-receipt-separator"></div><div style="text-align:center">Dokumen penutupan kasir</div>`;
  setTimeout(() => window.print(), 150);
}

function openShiftModal() {
  showModal("Buka Kasir - Modal Awal", async (val) => {
    const { error } = await supabaseClient.rpc("open_shift", { opening_cash: val });
    if (error) { alert(error.message); return; }
    await loadDashboard();
  });
}

function closeShiftModal(closeType) {
  const title = closeType === "harian" ? "Tutup Harian - Total Uang di Laci" : "Tutup Shift - Total Uang di Laci";
  showModal(title, async (val) => {
    const shiftId = activeShift.id;
    const { error } = await supabaseClient.rpc("close_shift", {
      shift_id: shiftId, closing_cash: val, close_type: closeType,
    });
    if (error) { alert(error.message); return; }
    await renderDashboardClosingReceipt(closeType, val);
    await loadDashboard();
  }, true);
}

async function loadDashboard() {
  const session = await requireLogin();
  if (!session) return;

  const userId = session.user.id;

  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("role, full_name, organization_id, store_id")
    .eq("id", userId)
    .maybeSingle();

  if (profileError || !profile) {
    renderError("Gagal memuat data profil. Coba login ulang.");
    return;
  }

  sessionStorage.setItem("smarterp_role", profile.role);
  sessionStorage.setItem("smarterp_full_name", profile.full_name || "");
  sessionStorage.setItem("smarterp_org_id", profile.organization_id);

  const isOrgWide = profile.role === "admin_organisasi" || profile.role === "super_admin";
  let activeStoreId = sessionStorage.getItem("smarterp_active_store_id") || profile.store_id;

  let storeLabel = "Semua Toko";
  let switcherHtml = "";
  let bannerHtml = "";

  if (isOrgWide) {
    const stores = await getOrgStores(profile.organization_id);
    if (stores.length === 0) {
      bannerHtml = `<div class="banner">Organisasi kamu belum punya toko. <a href="daftar-toko.html">Tambah toko pertama →</a></div>`;
    } else {
      if (!activeStoreId) {
        activeStoreId = stores[0].id;
        sessionStorage.setItem("smarterp_active_store_id", activeStoreId);
      }
      switcherHtml = renderStoreSwitcherHtml(stores, activeStoreId);
      const matched = stores.find(s => s.id === activeStoreId);
      if (matched) storeLabel = `${matched.store_code} - ${matched.name}`;
    }
  } else if (profile.store_id) {
    const { data: store } = await supabaseClient
      .from("stores").select("name, store_code").eq("id", profile.store_id).maybeSingle();
    if (store) storeLabel = `${store.store_code} - ${store.name}`;
  }

  let shiftWidgetHtml = "";
  if (profile.role === "kasir") {
    activeShift = await getMyOpenShift(userId, profile.store_id);
    shiftWidgetHtml = renderShiftWidget();
  }
  const summaryHtml = await renderSummary(profile.organization_id, activeStoreId);

  document.getElementById("mainContent").innerHTML = `
    <div class="welcome-row">
      <div class="welcome-user">
        <div class="welcome-title">Halo, ${profile.full_name || "Pengguna"}</div>
        <span class="role-badge">${ROLE_LABEL[profile.role] || profile.role}</span>
      </div>
      <div class="welcome-store">
        <span class="active-store-name" id="activeStoreLabel">${storeLabel}</span>
        ${switcherHtml}
      </div>
    </div>
    ${bannerHtml}
    ${shiftWidgetHtml}
    ${summaryHtml}
    ${renderBackoffice(profile.role)}
  `;
  renderBackofficeTabs();
  renderBackofficePanel();
}

loadDashboard();
</script>
