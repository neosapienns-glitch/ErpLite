<script>
const SUPABASE_URL = "https://icqabcbjhmzytvajtfst.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljcWFiY2JqaG16eXR2YWp0ZnN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTU2NjcsImV4cCI6MjEwNTQ3MTY2N30.h-ui5M9g5EKFVl6TrT_iSM1W4yErgpDKyv3BIzUTt-U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------------------------------------------------------
// SHARED HELPERS
// ---------------------------------------------------------
const APP_VERSION = "2026-10-07-02";

const APP_MENUS = [
  { title: "POS Penjualan", icon: "🧾", href: "pos-penjualan.html", roles: ["admin_organisasi", "admin_toko", "kasir"] },
  { title: "Penjualan", icon: "💰", href: "penjualan.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Stok", icon: "📦", href: "stok.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Pembelian", icon: "🛒", href: "pembelian.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Transfer Stok", icon: "🔄", href: "transfer-stok.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Stok Opname", icon: "📋", href: "stok-opname.html", roles: ["admin_organisasi", "admin_toko", "staff_gudang"] },
  { title: "Laporan", icon: "📊", href: "laporan.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Master Barang", icon: "🏷️", href: "menu.html", roles: ["admin_organisasi", "admin_toko"] },
  { title: "Daftar Toko", icon: "🏬", href: "daftar-toko.html", roles: ["super_admin", "admin_organisasi"] },
  { title: "Pengguna", icon: "👥", href: "pengguna.html", roles: ["super_admin", "admin_organisasi", "admin_toko"] },
];

function initAppShell() {
  const role = sessionStorage.getItem("smarterp_role");
  const currentPage = window.location.pathname.split("/").pop();
  const isShiftHolder = ["kepala_toko", "asisten_toko", "merchandiser"].includes(role);
  const links = [{ title: "Dashboard", icon: "⌂", href: "dashboard.html" }, ...APP_MENUS.filter(menu => !role || menu.roles.includes(role) || (isShiftHolder && menu.href !== "daftar-toko.html"))];
  document.getElementById("sidebarNav").innerHTML = links.map(menu => `
    <a class="nav-item ${menu.href === currentPage ? "active" : ""}" href="${menu.href}" ${menu.href === currentPage ? 'aria-current="page"' : ""}>
      <span class="nav-icon">${menu.icon}</span><span class="nav-text">${menu.title}</span>
    </a>
  `).join("");
}

function toggleSidebar() {
  const shell = document.querySelector(".app-shell");
  const button = document.getElementById("sidebarToggleBtn");
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  const isOpen = isMobile
    ? shell.classList.toggle("sidebar-open")
    : (shell.classList.toggle("sidebar-collapsed"), !shell.classList.contains("sidebar-collapsed"));
  button.setAttribute("aria-expanded", String(isOpen));
  button.setAttribute("aria-label", isOpen ? "Tutup sidebar" : "Buka sidebar");
  button.title = isOpen ? "Tutup sidebar" : "Buka sidebar";
}
initAppShell();

function applyThemeIcon() {
  const current = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  btn.textContent = current === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  let next;
  if (!current) next = 'light';
  else if (current === 'light') next = 'dark';
  else next = null;
  if (next) { html.setAttribute('data-theme', next); localStorage.setItem('smarterp_theme', next); }
  else { html.removeAttribute('data-theme'); localStorage.removeItem('smarterp_theme'); }
  applyThemeIcon();
}
function updateOnlineStatus() {
  const dot = document.getElementById('onlineDot');
  const text = document.getElementById('onlineText');
  if (!dot || !text) return;
  const online = navigator.onLine;
  dot.style.background = online ? 'var(--success)' : 'var(--danger)';
  text.textContent = online ? 'Online' : 'Offline';
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const res = await fetch(window.location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/app-version"\s+content="([^"]+)"/);
    if (match && match[1] !== APP_VERSION) showUpdateBanner();
  } catch (e) {}
}
function showUpdateBanner() {

// ---------- MODAL GENERIK ----------
function openFormModal(title, bodyHtml) {
  closeFormModal();
  const overlay = document.createElement("div");
  overlay.id = "formModalOverlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="modal-close-btn" onclick="closeFormModal()">✕</button>
      </div>
      ${bodyHtml}
    </div>
  `;
  document.body.appendChild(overlay);
}
function closeFormModal() {
  const el = document.getElementById("formModalOverlay");
  if (el) el.remove();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function escapeHtmlAttribute(str) {
  return escapeHtml(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderRowActions(table, record) {
  if (!canEdit) return "";
  const name = escapeHtmlAttribute(record.name);
  const id = escapeHtmlAttribute(record.id);
  return `<td class="table-actions" data-label="Aksi">
    <button class="row-action-btn edit-btn" aria-label="Edit ${name}" title="Edit" onclick="editRecord('${table}','${id}')">✏️</button>
    <button class="row-action-btn delete-btn" aria-label="Hapus ${name}" title="Hapus" onclick="deleteRow('${table}','${id}')">🗑️</button>
  </td>`;
}

function renderDataTable(columns, rows, emptyMessage) {
  if (rows.length === 0) return `<div class="empty-state">${emptyMessage}</div>`;
  return `
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>${columns.map(column => `<th scope="col">${column}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
  `;
}

async function loadBarangRefData() {
  const [sup, div, dept, unit] = await Promise.all([
    supabaseClient.from("suppliers").select("id, supplier_code, name").eq("organization_id", myOrgId).order("name"),
    supabaseClient.from("divisions").select("id, code, name").eq("organization_id", myOrgId).order("code"),
    supabaseClient.from("departments").select("id, code, name, division_id").eq("organization_id", myOrgId).order("code"),
    supabaseClient.from("units").select("id, code, name").eq("organization_id", myOrgId).order("code"),
  ]);
  suppliersCache = sup.data || [];
  divisionsCache = div.data || [];
  departmentsCache = dept.data || [];
  unitsCache = unit.data || [];
}

function missingRefData() {
  const missing = [];
  if (suppliersCache.length === 0) missing.push("Supplier");
  if (divisionsCache.length === 0) missing.push("Divisi");
  if (departmentsCache.length === 0) missing.push("Departemen");
  if (unitsCache.length === 0) missing.push("Satuan");
  return missing;
}

async function loadBarangTab() {
  await loadBarangRefData();
  const missing = missingRefData();
  if (missing.length > 0) {
    document.getElementById("mainContent").innerHTML = `
      <div class="empty-state">Lengkapi dulu data ${missing.join(", ")} sebelum bisa input Barang.</div>
    `;
    return;
  }
  if (!selectedSupplierId) selectedSupplierId = suppliersCache[0].id;

  const { data: items, error } = await supabaseClient
    .from("items")
    .select("id, plu, name, selling_price, purchase_price, suppliers(name), divisions(code), departments(code), units!items_base_unit_id_fkey(code)")
    .eq("organization_id", myOrgId)
    .order("plu", { ascending: true });
  if (error) { renderError("Gagal memuat barang: " + error.message); return; }

  const rows = (items || []).map(it => `
    <tr>
      <td class="table-code" data-label="PLU">${escapeHtml(it.plu)}</td>
      <td class="table-name" data-label="Nama barang">${escapeHtml(it.name)}</td>
      <td data-label="Pemasok">${it.suppliers ? escapeHtml(it.suppliers.name) : "-"}</td>
      <td data-label="Divisi / Departemen">${it.divisions ? escapeHtml(it.divisions.code) : "-"} / ${it.departments ? escapeHtml(it.departments.code) : "-"}</td>
      <td class="table-number" data-label="Harga beli">Rp ${Number(it.purchase_price || 0).toLocaleString("id-ID")}/${it.units ? escapeHtml(it.units.code) : "-"}</td>
      <td class="table-number" data-label="Harga jual">Rp ${Number(it.selling_price || 0).toLocaleString("id-ID")}</td>
      ${renderRowActions("items", it)}
    </tr>
  `);
  const listHtml = renderDataTable(["PLU", "Nama barang", "Pemasok", "Divisi / Departemen", "Harga beli", "Harga jual", ...(canEdit ? ["Aksi"] : [])], rows, "Belum ada barang.");

  const topControlsHtml = canEdit ? `
    <div class="field">
      <label>Supplier Aktif (dipakai buat Tambah Barang & Import CSV)</label>
      <select id="supplierSelect" onchange="onChangeSupplier(this.value)">
        ${suppliersCache.map(s => `<option value="${s.id}" ${s.id === selectedSupplierId ? "selected" : ""}>${s.supplier_code} - ${s.name}</option>`).join("")}

    <div class="add-btn-row"><button class="btn-add" onclick="openBarangModal()">+ Tambah Barang</button></div>
  ` : "";

  const importHtml = canEdit ? `
    <div class="import-box">
      <div class="section-title" style="margin-top:0;">Import CSV (Supplier Aktif)</div>
      <button class="btn-secondary" onclick="downloadCsvTemplate()">Download Template CSV</button>
      <input type="file" id="csvFileInput" accept=".csv" />

function onChangeDivisiForm(divisionId) {
  const deptSelect = document.getElementById("f_department");
  if (!deptSelect) return;
  const filtered = departmentsCache.filter(d => d.division_id === divisionId);
  deptSelect.innerHTML = filtered.length
    ? filtered.map(d => `<option value="${d.id}">${d.code} - ${escapeHtml(d.name)}</option>`).join("")
    : `<option value="">(belum ada departemen di divisi ini)</option>`;
}

function formatRupiahInput(el) {
  const raw = el.value.replace(/[^\d]/g, "");
  el.value = raw === "" ? "" : Number(raw).toLocaleString("id-ID");
}

function getRawNumber(el) {
  return parseFloat((el.value || "0").replace(/[^\d]/g, "")) || 0;
}

function updateBuyHint() {
  const price = getRawNumber(document.getElementById("f_buy_price"));
  const conv = parseFloat(document.getElementById("f_conv").value) || 1;
  const perBase = conv > 0 ? (price / conv) : price;
  document.getElementById("buyHint").textContent = `Harga beli per satuan dasar: Rp ${perBase.toLocaleString("id-ID", { maximumFractionDigits: 2 })}`;
}

async function onSubmitBarang(e, itemId = null) {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("alertBox");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  alertBox.className = "alert";

  const departmentId = document.getElementById("f_department").value;
  if (!departmentId) {
    alertBox.textContent = "Divisi ini belum punya departemen.";
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = itemId ? "Simpan Perubahan" : "Simpan Barang";
    return;
  }

  const payload = {
    organization_id: myOrgId,
    name: document.getElementById("f_name").value.trim(),
    barcode: document.getElementById("f_barcode").value.trim() || null,
    supplier_id: selectedSupplierId,
    division_id: document.getElementById("f_division").value,
    department_id: departmentId,
    base_unit_id: document.getElementById("f_base_unit").value,
    purchase_unit_id: document.getElementById("f_purchase_unit").value,
    conversion_qty: parseFloat(document.getElementById("f_conv").value),
    purchase_price: getRawNumber(document.getElementById("f_buy_price")),
    selling_price: getRawNumber(document.getElementById("f_sell_price")),
  };

  const { error } = itemId
    ? await supabaseClient.from("items").update(payload).eq("id", itemId)
    : await supabaseClient.from("items").insert(payload);
  if (error) {
    alertBox.textContent = error.message;
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = itemId ? "Simpan Perubahan" : "Simpan Barang";
    return;
  }
  closeFormModal();
  await loadBarangTab();
}

// ---------- IMPORT CSV ----------
function downloadCsvTemplate() {
  const header = "nama_barang,divisi_kode,departemen_kode,satuan_dasar_kode,satuan_beli_kode,isi_per_satuan_beli,harga_beli_per_satuan_beli,harga_jual_per_pcs";
  const example = divisionsCache[0] && departmentsCache[0] && unitsCache[0]
    ? `Contoh Barang,${divisionsCache[0].code},${departmentsCache[0].code},${unitsCache[0].code},${unitsCache[0].code},1,10000,12000`
    : "";
  const csv = header + "\n" + example;
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "template_barang.csv";
  a.click();
  URL.revokeObjectURL(url);
}

async function processCsvImport() {
  const fileInput = document.getElementById("csvFileInput");
  const reportBox = document.getElementById("importReport");
  if (!fileInput.files.length) { alert("Pilih file CSV dulu."); return; }

  const text = await fileInput.files[0].text();
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  if (lines.length < 2) { reportBox.innerHTML = `<div class="fail">File CSV kosong atau cuma ada header.</div>`; return; }

  const rows = lines.slice(1);
  let successCount = 0;
  const errors = [];
  let firstPlu = null, lastPlu = null;

  for (let i = 0; i < rows.length; i++) {
    const rowNum = i + 2; // +2 karena baris 1 = header, index mulai 0
    const cols = rows[i].split(",").map(c => c.trim());
    if (cols.length < 8) { errors.push(`Baris ${rowNum}: kolom tidak lengkap`); continue; }

    const [name, divCode, deptCode, baseUnitCode, purchUnitCode, convStr, buyStr, sellStr] = cols;

    const div = divisionsCache.find(d => d.code === divCode);
    if (!div) { errors.push(`Baris ${rowNum}: Divisi "${divCode}" tidak ditemukan`); continue; }
    const dept = departmentsCache.find(d => d.code === deptCode && d.division_id === div.id);
    if (!dept) { errors.push(`Baris ${rowNum}: Departemen "${deptCode}" tidak ditemukan di divisi ${divCode}`); continue; }
    const baseUnit = unitsCache.find(u => u.code === baseUnitCode);
    if (!baseUnit) { errors.push(`Baris ${rowNum}: Satuan dasar "${baseUnitCode}" tidak ditemukan`); continue; }
    const purchUnit = unitsCache.find(u => u.code === purchUnitCode);
    if (!purchUnit) { errors.push(`Baris ${rowNum}: Satuan beli "${purchUnitCode}" tidak ditemukan`); continue; }

    const conv = parseFloat(convStr);
    const buy = parseFloat(buyStr);
    const sell = parseFloat(sellStr);
    if (!name || isNaN(conv) || conv <= 0 || isNaN(buy) || isNaN(sell)) {
      errors.push(`Baris ${rowNum}: nama/angka tidak valid`); continue;
    }

    const { data: inserted, error } = await supabaseClient.from("items").insert({
      organization_id: myOrgId,
      name, supplier_id: selectedSupplierId,
      division_id: div.id, department_id: dept.id,
      base_unit_id: baseUnit.id, purchase_unit_id: purchUnit.id,
      conversion_qty: conv, purchase_price: buy, selling_price: sell,
    }).select("plu").single();

    if (error) { errors.push(`Baris ${rowNum}: ${error.message}`); continue; }
    successCount++;
    if (!firstPlu) firstPlu = inserted.plu;
    lastPlu = inserted.plu;
  }

  let reportHtml = `<div class="ok">✅ Berhasil diimpor: ${successCount} item${firstPlu ? ` (PLU ${firstPlu} - ${lastPlu})` : ""}</div>`;
  if (errors.length > 0) {
    reportHtml += `<div class="fail">❌ Gagal: ${errors.length} item</div>` + errors.map(e => `<div class="fail">- ${escapeHtml(e)}</div>`).join("");
  }
  reportBox.innerHTML = reportHtml;

  if (successCount > 0) await loadBarangTab();
}

// ---------- GENERIC HELPERS ----------
async function submitGeneric(table, payload, reloadFn, recordId = null) {
  const btn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("alertBox");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  alertBox.className = "alert";

  const { error } = recordId
    ? await supabaseClient.from(table).update(payload).eq("id", recordId)
    : await supabaseClient.from(table).insert(payload);
  if (error) {
    alertBox.textContent = error.message;
    alertBox.className = "alert show alert-error";
    btn.disabled = false; btn.textContent = recordId ? "Simpan Perubahan" : "Simpan";
    return;
  }
  await reloadFn();
}

function editRecord(table, id) {
  const editors = {
    suppliers: openSupplierModal,
    divisions: openDivisiModal,
    departments: openDepartemenModal,
    units: openSatuanModal,
    items: openBarangModal,
  };
  if (editors[table]) editors[table](id);
}

async function deleteRow(table, id) {
  if (!confirm("Hapus data ini?")) return;
  const { error } = await supabaseClient.from(table).delete().eq("id", id);
  if (error) { alert("Gagal hapus: " + error.message); return; }
  loadActiveTab();
}

function loadActiveTab() {
  document.getElementById("mainContent").innerHTML = `<div class="loading">Memuat...</div>`;
  if (activeTab === "supplier") loadSupplierTab();
  else if (activeTab === "divisi") loadDivisiTab();
  else if (activeTab === "departemen") loadDepartemenTab();
  else if (activeTab === "satuan") loadSatuanTab();
  else if (activeTab === "barang") loadBarangTab();
}

async function init() {
  const session = await requireLogin();
  if (!session) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles").select("role, organization_id")
    .eq("id", session.user.id).maybeSingle();
  if (error || !profile) { renderError("Gagal memuat profil."); return; }

  if (!["admin_organisasi", "admin_toko", "staff_gudang", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role)) {
    renderError("Kamu tidak punya akses ke halaman ini.");
    return;
  }

  myOrgId = profile.organization_id;
  canEdit = ["admin_organisasi", "admin_toko", "super_admin", "kepala_toko", "asisten_toko", "merchandiser"].includes(profile.role);

  renderSubtabs();
  loadActiveTab();
}

init();
</script>
